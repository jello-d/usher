[project]
name = "usher-indicator"
version = "0.1.0"
description = "SNI tray indicator for usher window placement"
requires-python = ">=3.9"
dependencies = ["dbus-next>=0.2.3", "Pillow>=9"]
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.scripts]
usher-indicator = "usher_indicator.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
