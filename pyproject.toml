[project]
name = "usher"
version = "0.1.0"
description = "Record and restore the Wayland window layout (wlroots/Wayfire)"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["wayfire==3.2"]

[project.scripts]
usher = "usher.cli:main"
usher-mgr = "usher.cli:main_mgr"

[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["usher"]
