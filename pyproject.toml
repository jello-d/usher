[project]
name = "usher"
version = "0.1.0"
description = "Record and restore the Wayland window layout (wlroots/Wayfire)"
requires-python = ">=3.9"
dependencies = ["wayfire==3.2"]
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.scripts]
usher = "session_mgr.cli:main"
usher-mgr = "session_mgr.cli:main_mgr"
# One release only, so the rename can be staged across two repos. See
# cli.main_legacy for why two names on PATH is acceptable here and when to drop
# this line.
session-mgr = "session_mgr.cli:main_legacy"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["session_mgr"]
