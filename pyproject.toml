[project]
name = "usher"
version = "0.1.0"
description = "Record and restore the Wayland window layout (wlroots/Wayfire)"
requires-python = ">=3.9"
dependencies = ["wayfire==3.2"]
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.scripts]
session-mgr = "session_mgr:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["session_mgr"]
